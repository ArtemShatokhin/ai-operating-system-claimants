# What each "AI operating system" claimant says about itself.
# Every entry quotes the vendor's own page. Re-check with: python3 check.py
# last_checked: 2026-10-21
claimants:
  - name: Cloudflare OS
    page: https://github.com/cloudflare/cloudflare-os
    launch_post: https://blog.cloudflare.com/cloudflare-os
    calls_itself: "an operating system for AI productivity"
    open_source_claim: true
    quote: "We are making Cloudflare OS open source so that others can copy it and customize it for their own company."
    production_path: "deploy to your Cloudflare account"
    status: "version 2, early access, August 2026 rewrite"
  - name: Red Hat AI OS
    page: https://www.redhat.com/en/blog/developing-standard-ai-os
    calls_itself: "a standard AI operating system (AI OS)"
    open_source_claim: true
    quote: "Built on open source technology"
    production_path: "a standardized AI layer on existing open-source infrastructure"
    status: "a vendor position in a blog post, not a separate product download"
  - name: VAST AI OS
    page: https://www.vastdata.com/platform/ai-os
    calls_itself: "The VAST AI Operating System"
    open_source_claim: false
    quote: "The VAST AI OS pulls all of it into a single unified infrastructure layer."
    production_path: "a data and inference platform sold by the vendor"
    status: "product page"
  - name: Xyne
    page: https://2026.allthingsopen.org/ai-operating-system-for-organizations-built-the-unix-way
    calls_itself: "an open-source operating system for organizations"
    open_source_claim: true
    quote: "an open-source operating system for organizations"
    production_path: "on infrastructure the organization controls"
    status: "All Things Open 2026 community post"
  - name: OpenFang
    page: https://raw.githubusercontent.com/RightNow-AI/openfang/main/README.md
    calls_itself: "The Agent Operating System"
    open_source_claim: true
    quote: "Open-source Agent OS built in Rust."
    production_path: "one binary, installed on the operator's machine"
    status: "v0.6.9, published 12 May 2026; the project still calls itself pre-1.0"
  - name: Paperclip
    page: https://raw.githubusercontent.com/paperclipai/paperclip/master/README.md
    calls_itself: "the app people use to manage AI agents for work"
    open_source_claim: true
    quote: "Paperclip is the app people use to manage AI agents for work."
    production_path: "a Node.js server and React UI you run; a cloud edition sits on a waitlist"
    status: "MIT, repository active in October 2026"
